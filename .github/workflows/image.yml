name: image

on:
  push:
    branches: [main]
    paths:
      - "package.nix"
      - "server/**"
      - "version.json"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/atomic-235/kiji-pii

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build image
        run: nix build .#docker --print-build-logs

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.arch }}
        run: |
          docker load -i result
          docker tag "$IMAGE:latest" "$IMAGE:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker push "$IMAGE:sha-${GITHUB_SHA}-${{ matrix.arch }}"

  manifest:
    name: manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch tags
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-${GITHUB_SHA}" \
            "$IMAGE:sha-${GITHUB_SHA}-amd64" \
            "$IMAGE:sha-${GITHUB_SHA}-arm64"
